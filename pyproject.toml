[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sand"
version = "0.9.3"
description = "Spreadsheets Are Not Databases — turn spreadsheets into a queryable DB with chat and charts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "duckdb>=1.1.0",
    "plotly>=5.24.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyarrow>=15.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-openpyxl>=3.1.0",
]

[project.scripts]
sand = "sand.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sand = [
  "web/*",
  "web/js/*",
  "web/vendor/plotly/*",
  "samples/*",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",
    "B008",  # FastAPI Depends/File/Form in defaults is idiomatic
]

[tool.mypy]
python_version = "3.12"
files = ["src/sand"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false
exclude = "(?x)(\\.sand-venv/|build/|tests/)"
